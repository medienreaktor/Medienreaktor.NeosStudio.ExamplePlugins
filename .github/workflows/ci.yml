name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  # Lets a release be re-verified without an empty commit.
  workflow_dispatch:

# Supersede a run when the same pull request branch is pushed again, but never
# cancel one on main or a manual re-verification — those exist to leave a verdict
# on a commit, and a cancelled one leaves none.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Nothing here writes to the repository; the token only lifts Composer's
# unauthenticated GitHub API rate limit when fetching dist archives.
permissions:
  contents: read

# Third-party actions are pinned by commit SHA rather than tag, because a tag can
# be moved onto different code after review. GitHub's own actions/* are pinned to
# the major, which GitHub controls and repoints deliberately.
env:
  # Installing Neos pulls well over a hundred packages as GitHub dist archives,
  # which exhausts the 60-per-hour unauthenticated API limit. Every dependency
  # resolves from Packagist, so no other registry needs credentials.
  COMPOSER_AUTH: '{"github-oauth":{"github.com":"${{ secrets.GITHUB_TOKEN }}"}}'

  # Everything neos/flow and neos/utility-unicode declare. ctype, filter, json,
  # libxml, openssl, pcre, phar, reflection and spl are in the default build and
  # need no request.
  PHP_EXTENSIONS: mbstring, xml, xmlreader, xmlwriter, simplexml, dom, tokenizer, zlib

jobs:
  # The package ships no PHP of its own, so there is nothing for PHPStan or
  # PHP_CodeSniffer to analyse; linting is the manifest.
  lint:
    name: Lint (PHP 8.4, highest deps)
    # GitHub-hosted rather than the org's runner scale set: this repository is
    # public, so its minutes are free, and a self-hosted runner would execute code
    # from pull requests opened on forks.
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # Supplies both the interpreter and Composer, so nothing has to be fetched
      # from getcomposer.org at job time. The official `composer` image was the
      # alternative, but it ships exactly one PHP version and so cannot serve the
      # matrix below.
      - name: Set up PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.4'
          extensions: ${{ env.PHP_EXTENSIONS }}
          tools: composer:v2
          coverage: none

      - name: Install dependencies
        uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0
        with:
          dependency-versions: highest
          composer-options: "--prefer-dist"

      # composer validate --strict runs as part of this, as lint:composer. The
      # manifest is this package's contract with every consuming distribution, and
      # a wrong constraint there is exactly the class of bug that reaches projects
      # silently.
      - name: Run Linting (composer validate)
        run: composer lint

  install:
    name: Install (PHP ${{ matrix.php }}, ${{ matrix.deps }} deps)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      # Let every version report rather than killing the rest when the first one
      # fails.
      fail-fast: false
      matrix:
        # The package has no PHP test suite, so this matrix proves what it can:
        # that the range composer.json declares installs on every interpreter it
        # covers. Neos Studio 2 sets the floor at PHP 8.4, and both ends of the
        # range are exercised rather than asserted:
        #
        #   - `lowest` pins the oldest set Composer will install against the
        #     constraints, which is the one a consuming distribution could
        #     actually end up with.
        #   - `highest` walks up to the newest releases.
        #
        # 8.5 pairs with `highest` only: the oldest set is proven on the floor
        # interpreter, the newest interpreter on the newest set.
        include:
          - { php: '8.4', deps: 'lowest' }
          - { php: '8.4', deps: 'highest' }
          - { php: '8.5', deps: 'highest' }

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          extensions: ${{ env.PHP_EXTENSIONS }}
          tools: composer:v2
          coverage: none

      # Resolves from the constraints every time — no composer.lock is committed,
      # which is what makes the lowest/highest split meaningful. The action caches
      # the Composer download cache per PHP version and dependency preference.
      - name: Install dependencies
        uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0
        with:
          dependency-versions: ${{ matrix.deps }}
          composer-options: "--prefer-dist"

      # Makes the floor claim auditable: the log states which Neos and Studio the
      # job actually resolved, rather than leaving it to be inferred from the
      # matrix name.
      - name: Show resolved dependency versions
        run: composer show --direct

  # The plugin bundle is built at install time rather than committed, so this
  # job checks that the sources format cleanly and bundle.
  frontend:
    name: Frontend (formats and builds)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: Resources/Private/Plugin

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # .nvmrc is the one place the Node version is pinned; the build output
      # depends on it, so CI reads the same file a developer's toolchain does.
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: Resources/Private/Plugin/.nvmrc
          cache: npm
          cache-dependency-path: Resources/Private/Plugin/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check formatting (Prettier)
        run: npm run format:check

      # Bundle only. The type check (`npm run build` starts with tsc) maps the
      # plugin API to the declarations Studio ships in
      # Resources/Public/Studio/types/ of the Studio package installed next to
      # this one, which this job does not check out.
      - name: Build
        # Both bundles: plugin.js and the preview's guest.js.
        run: npm run bundle
