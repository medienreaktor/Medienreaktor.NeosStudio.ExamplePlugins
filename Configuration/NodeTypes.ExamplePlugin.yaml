# Demo wiring for the ExampleEditor: adds a "highlight colour" string property
# to the demo text node, configured to use the editor this package registers
# (id 'Medienreaktor.NeosStudio.ExamplePlugins/Editors/Example'). Open a
# Neos.Demo text element in the Studio inspector to see it.
#
# This is only here so the boilerplate shows something end-to-end; point the
# editor at your own node type's property instead. If Neos.Demo is not
# installed this block simply applies to nothing.
'Neos.Demo:Content.Text':
  ui:
    inspector:
      groups:
        examplePlugin:
          label: 'Example plugin'
          icon: 'puzzle-piece'
          position: 950
  properties:
    # The "highlight" rich text extension (src/richText.ts) is enabled per
    # property by a formatting key. This merges it into the demo text's
    # existing formatting, for inline editing in the preview.
    text:
      ui:
        inline:
          editorOptions:
            formatting:
              highlight: true
    examplePluginHighlight:
      type: string
      ui:
        label: 'Highlight colour'
        reloadIfChanged: false
        inspector:
          group: 'examplePlugin'
          position: 10
          editor: 'Medienreaktor.NeosStudio.ExamplePlugins/Editors/Example'
          editorOptions:
            # Swatches offered by the ExampleEditor - read via props.options.
            colors:
              - '#ef4444'
              - '#f59e0b'
              - '#10b981'
              - '#3b82f6'
              - '#a855f7'
